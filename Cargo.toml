[package]
name = "webappfirewall"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
governor = "0.10.4"
nonzero_macros = "0.16.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }

[[bin]]
name = "webappfirewall"
path = "main.rs"
